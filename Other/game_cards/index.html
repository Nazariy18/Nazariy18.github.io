<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Карткова гра</title>
  <style>
    /* ФОН СТОРІНКИ ТА ЦЕНТРУВАННЯ */
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); 
      display: flex; 
      flex-direction: column; 
      justify-content: center; 
      align-items: center;     
      padding: 15px; 
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden; 
      box-sizing: border-box;
    }
    
    h1, h2 { color: #fff; margin-top: 0; }
    #setup-screen h2 { color: #2c3e50; }

    /* ГОЛОВНИЙ БЛОК */
    .screen { 
      background: white; 
      padding: 25px; 
      border-radius: 15px; 
      box-shadow: 0 10px 40px rgba(0,0,0,0.6); 
      width: 100%; 
      max-width: min(95vw, 75vh, 800px); 
      text-align: center; 
      box-sizing: border-box;
      margin: 0;
    }
    
    #game-screen, #end-screen { background: transparent; box-shadow: none; padding: 0; }

    .hidden { display: none !important; }

    /* ЕКРАН ВИБОРУ */
    #blocks-container { max-height: 45vh; overflow-y: auto; padding-right: 5px; margin-bottom: 15px; }
    .block-group { margin-bottom: 10px; background: #ecf0f1; border-radius: 8px; overflow: hidden; text-align: left; }
    .block-header { display: flex; align-items: center; padding: 15px; cursor: pointer; }
    .block-header:hover { background: #dfe6e9; }
    .block-header input { margin-right: 15px; transform: scale(1.3); cursor: pointer; }
    .block-title { flex-grow: 1; font-weight: 600; display: flex; justify-content: space-between; color: #333; }
    .cards-list { background: #fdfdfd; border-top: 1px solid #ddd; padding: 10px 15px 15px 45px; display: none; }
    .cards-list.open { display: block; }
    .card-label { display: flex; align-items: flex-start; margin: 10px 0; cursor: pointer; color: #333; }
    .card-label input { margin-top: 3px; margin-right: 12px; transform: scale(1.2); }

    button { background: #3498db; color: white; border: none; padding: 15px; font-size: 18px; border-radius: 8px; cursor: pointer; margin-top: 10px; width: 100%; font-weight: bold; transition: background 0.2s; }
    button:hover { background: #2980b9; }
    
    .btn-green { background: #27ae60; }
    .btn-green:hover { background: #219653; }

    /* ФОРМА ДОДАВАННЯ КАРТКИ */
    .add-card-form { background: #f8f9fa; padding: 15px; border-radius: 8px; text-align: left; border: 1px solid #e1e8ed; }
    .add-card-form input, .add-card-form select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-family: inherit; font-size: 16px; margin-bottom: 10px; }

    /* ІГРОВІ КАРТКИ (КВАДРАТНІ) */
    #card-stack {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1; 
      margin-bottom: 20px;
    }

    .card-element { 
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      color: white; 
      border-radius: 20px; 
      display: flex; 
      flex-direction: column; 
      justify-content: center; 
      align-items: center; 
      padding: 8%; 
      font-size: clamp(20px, 5vw, 32px); 
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      user-select: none; 
      -webkit-user-select: none;
      box-sizing: border-box;
      will-change: transform, opacity;
      word-wrap: break-word;
    }

    #card-top { z-index: 2; cursor: grab; touch-action: none; }
    #card-bottom { z-index: 1; }
    
    .hints { font-size: clamp(14px, 3vw, 16px); color: #a8a3a0; margin-bottom: 15px; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }
    #stats { font-size: clamp(14px, 3vw, 18px); color: #dcdde1; font-weight: bold; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); line-height: 1.5; }
  </style>
</head>
<body>

  <!-- ЕКРАН 1: НАЛАШТУВАННЯ -->
  <div id="setup-screen" class="screen">
    <h2>Оберіть картки для гри:</h2>
    <div id="blocks-container"></div>
    
    <!-- Форма для кастомних карток -->
    <div class="add-card-form">
      <div style="font-weight: bold; color: #2c3e50; margin-bottom: 10px;">+ Додати свою картку:</div>
      <input type="text" id="custom-card-text" placeholder="Текст вашого питання...">
      <div style="display: flex; gap: 10px;">
        <select id="custom-card-level" style="flex: 1; margin: 0;">
          <option value="1">Рівень 1</option>
          <option value="2">Рівень 2</option>
          <option value="3">Рівень 3</option>
          <option value="4">Рівень 4</option>
          <option value="5">Рівень 5</option>
          <option value="6">Рівень 6</option>
          <option value="7">Рівень 7</option>
          <option value="8">Рівень 8</option>
          <option value="9">Рівень 9</option>
          <option value="10">Рівень 10</option>
        </select>
        <button onclick="addCustomCard()" class="btn-green" style="margin: 0; width: auto; padding: 10px 20px;">Додати</button>
      </div>
    </div>

    <button onclick="startGame()" style="margin-top: 15px;">Почати гру</button>
  </div>

  <!-- ЕКРАН 2: ГРА -->
  <div id="game-screen" class="screen hidden">
    <div id="card-stack">
      <div id="card-bottom" class="card-element"></div>
      <div id="card-top" class="card-element"></div>
    </div>
    
    <div class="hints">⬅️ Попередня &nbsp;&nbsp; | &nbsp;&nbsp; Наступна ➡️</div>
    <div id="stats">Завантаження статистики...</div>
  </div>

  <!-- ЕКРАН 3: ФІНІШ -->
  <div id="end-screen" class="screen hidden" style="background: white; padding: 40px;">
    <h2 style="color: #2c3e50;">Гру завершено!</h2>
    <button onclick="resetToSetup()">Почати спочатку</button>
  </div>

  <script src="data.js"></script>
  <script>
    let activeCardsData = [];
    
    let gameDeck = [];
    let history = []; 
    let historyIndex = -1; 
    let stagedNextCard = null; 

    // Змінні для анімації
    let isDragging = false;
    let startPosition = 0;
    let currentTranslate = 0;
    let dragDirection = 0; 
    let currentSwipeThreshold = 150; 

    window.onload = () => {
      activeCardsData = JSON.parse(JSON.stringify(cardsData));
      renderSetupScreen();

      // --- ЛОГІКА ПЕРЕТЯГУВАННЯ ---
      const cardTop = document.getElementById('card-top');
      cardTop.addEventListener('touchstart', dragStart, { passive: true });
      cardTop.addEventListener('mousedown', dragStart);
      window.addEventListener('touchmove', dragAction, { passive: true });
      window.addEventListener('mousemove', dragAction);
      window.addEventListener('touchend', dragEnd);
      window.addEventListener('mouseup', dragEnd);
    };

    function saveCheckboxStates() {
      const container = document.getElementById('blocks-container');
      if (!container.innerHTML) return; 

      activeCardsData.forEach((block, bIndex) => {
        const blockCb = document.getElementById(`block-cb-${bIndex}`);
        if (blockCb) block.checked = blockCb.checked;

        block.cardStates = block.cardStates || [];
        block.cards.forEach((_, cIndex) => {
          const cardCb = document.querySelector(`.card-cb-${bIndex}[data-cindex="${cIndex}"]`);
          if (cardCb) block.cardStates[cIndex] = cardCb.checked;
        });
      });
    }

    function renderSetupScreen() {
      saveCheckboxStates(); 

      const container = document.getElementById('blocks-container');
      container.innerHTML = ''; 

      activeCardsData.forEach((block, bIndex) => {
        if (block.checked === undefined) block.checked = true;

        const group = document.createElement('div');
        group.className = 'block-group';
        
        const header = document.createElement('div');
        header.className = 'block-header';
        
        const blockCheckbox = document.createElement('input');
        blockCheckbox.type = 'checkbox';
        blockCheckbox.id = `block-cb-${bIndex}`;
        blockCheckbox.checked = block.checked;
        blockCheckbox.onchange = (e) => {
          document.querySelectorAll(`.card-cb-${bIndex}`).forEach(cb => cb.checked = e.target.checked);
        };

        const title = document.createElement('div');
        title.className = 'block-title';
        title.innerHTML = `${block.name} (Рівень ${block.level}) <span>▼</span>`;
        
        header.onclick = (e) => { 
          if(e.target !== blockCheckbox) document.getElementById(`cards-list-${bIndex}`).classList.toggle('open'); 
        };
        
        header.appendChild(blockCheckbox); 
        header.appendChild(title); 
        group.appendChild(header);

        const list = document.createElement('div');
        list.className = 'cards-list';
        list.id = `cards-list-${bIndex}`;
        
        if (block.isCustom) list.classList.add('open');

        block.cardStates = block.cardStates || [];
        block.cards.forEach((cardText, cIndex) => {
          if (block.cardStates[cIndex] === undefined) block.cardStates[cIndex] = true;

          const label = document.createElement('label');
          label.className = 'card-label';
          
          const cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.className = `card-checkbox card-cb-${bIndex}`;
          cb.dataset.bindex = bIndex;
          cb.dataset.cindex = cIndex;
          cb.checked = block.cardStates[cIndex];
          
          cb.onchange = () => {
            const allInBlock = document.querySelectorAll(`.card-cb-${bIndex}`);
            blockCheckbox.checked = Array.from(allInBlock).some(c => c.checked);
          };
          
          label.appendChild(cb); 
          label.appendChild(document.createTextNode(cardText)); 
          list.appendChild(label);
        });

        group.appendChild(list); 
        container.appendChild(group);
      });
    }

    function addCustomCard() {
      const textInput = document.getElementById('custom-card-text');
      const levelInput = document.getElementById('custom-card-level');
      
      const text = textInput.value.trim();
      const level = parseInt(levelInput.value);

      if (!text) {
        alert("Введіть текст картки!");
        return;
      }

      let customBlock = activeCardsData.find(b => b.isCustom && b.level === level);
      
      if (!customBlock) {
        customBlock = {
          name: "Мої картки",
          level: level,
          isCustom: true,
          cards: [],
          checked: true,
          cardStates: []
        };
        activeCardsData.push(customBlock);
      }

      customBlock.cards.push(text);
      customBlock.cardStates.push(true); 
      customBlock.checked = true; 

      textInput.value = ''; 
      renderSetupScreen(); 

      const container = document.getElementById('blocks-container');
      container.scrollTop = container.scrollHeight;
    }

    function getPositionX(event) {
      return event.type.includes('mouse') ? event.pageX : event.touches[0].clientX;
    }

    function dragStart(event) {
      if (document.getElementById('game-screen').classList.contains('hidden')) return;
      isDragging = true;
      dragDirection = 0;
      startPosition = getPositionX(event);
      
      const cardTop = document.getElementById('card-top');
      cardTop.style.transition = 'none'; 
      cardTop.style.cursor = 'grabbing';

      currentSwipeThreshold = document.getElementById('card-stack').offsetWidth * 0.6;
    }

    function dragAction(event) {
      if (!isDragging) return;
      
      currentTranslate = getPositionX(event) - startPosition;
      
      if (currentTranslate > 0 && dragDirection !== 1) {
        dragDirection = 1; 
        updateCardDOM('card-bottom', getUpcomingCard(), "Кінець гри");
      } else if (currentTranslate < 0 && dragDirection !== -1) {
        dragDirection = -1; 
        updateCardDOM('card-bottom', getPreviousCard(), "Це перша картка");
      }
      
      const cardTop = document.getElementById('card-top');
      cardTop.style.transform = `translateX(${currentTranslate}px)`;
      
      let opacity = 1 - (Math.abs(currentTranslate) / currentSwipeThreshold);
      if (opacity < 0) opacity = 0;
      cardTop.style.opacity = opacity;
    }

    function dragEnd() {
      if (!isDragging) return;
      isDragging = false;
      const cardTop = document.getElementById('card-top');
      
      cardTop.style.transition = 'transform 0.3s ease-out, opacity 0.3s ease-out';
      cardTop.style.cursor = 'grab';

      if (currentTranslate > currentSwipeThreshold) {
        if (getUpcomingCard()) goNext();
        else endGame();
      } else if (currentTranslate < -currentSwipeThreshold) {
        if (getPreviousCard()) goPrev();
        else snapBack();
      } else {
        snapBack();
      }
    }

    function snapBack() {
      const cardTop = document.getElementById('card-top');
      cardTop.style.transform = 'translateX(0)';
      cardTop.style.opacity = '1';
      currentTranslate = 0;
      dragDirection = 0;
    }

    function startGame() {
      saveCheckboxStates();

      gameDeck = [];
      history = [];
      historyIndex = -1;
      stagedNextCard = null;

      const allCardCheckboxes = document.querySelectorAll('.card-checkbox');
      allCardCheckboxes.forEach(cb => {
        if (cb.checked) {
          const bIndex = cb.dataset.bindex;
          const text = cb.parentNode.innerText.trim();
          gameDeck.push({ text: text, level: activeCardsData[bIndex].level });
        }
      });

      if(gameDeck.length === 0) return alert("Оберіть картки для гри!");
      
      document.getElementById('setup-screen').classList.add('hidden');
      document.getElementById('game-screen').classList.remove('hidden');
      
      goNext();
    }

    function resetToSetup() {
      document.getElementById('end-screen').classList.add('hidden');
      document.getElementById('setup-screen').classList.remove('hidden');
      renderSetupScreen(); 
    }

    function getUpcomingCard() {
      if (historyIndex < history.length - 1) return history[historyIndex + 1];
      if (gameDeck.length > 0) {
        if (!stagedNextCard) {
          const minLevel = Math.min(...gameDeck.map(c => c.level));
          const available = gameDeck.filter(c => c.level === minLevel);
          stagedNextCard = available[Math.floor(Math.random() * available.length)];
        }
        return stagedNextCard;
      }
      return null; 
    }

    function getPreviousCard() {
      if (historyIndex > 0) return history[historyIndex - 1];
      return null;
    }

    function goNext() {
      if (historyIndex < history.length - 1) {
        historyIndex++;
      } else if (gameDeck.length > 0) {
        if (!stagedNextCard) getUpcomingCard();
        const card = stagedNextCard;
        gameDeck.splice(gameDeck.indexOf(card), 1);
        history.push(card);
        historyIndex++;
        stagedNextCard = null; 
      }
      renderState();
    }

    function goPrev() {
      if (historyIndex > 0) {
        historyIndex--;
        renderState();
      }
    }

    function renderState() {
      const currentCard = history[historyIndex];
      updateCardDOM('card-top', currentCard);
      
      const cardTop = document.getElementById('card-top');
      cardTop.style.transition = 'none';
      cardTop.style.transform = 'translateX(0)';
      cardTop.style.opacity = '1';
      
      currentTranslate = 0;
      dragDirection = 0;

      let remainingCards = history.slice(historyIndex).concat(gameDeck);
      let totalCount = remainingCards.length;
      
      let currentLevel = currentCard.level;
      let currentLevelCount = remainingCards.filter(c => c.level === currentLevel).length;

      document.getElementById('stats').innerHTML = `
        Рівень ${currentLevel} &nbsp;|&nbsp; Залишилося: <span style="color:#fff">${currentLevelCount}</span> <br> 
        <span style="opacity: 0.7; font-size: 0.9em; font-weight: normal; display: inline-block; margin-top: 5px;">
          (Загалом залишилося: ${totalCount})
        </span>
      `;
    }

    function updateCardDOM(elementId, cardObj, fallbackText = "") {
      const el = document.getElementById(elementId);
      if (cardObj) {
        el.innerText = cardObj.text;
        el.style.background = getGradient(cardObj.level);
      } else {
        el.innerText = fallbackText;
        el.style.background = 'linear-gradient(135deg, #34495e, #2c3e50)';
      }
    }

    function getGradient(level) {
      switch(level) {
        case 1: return 'linear-gradient(135deg, #56ab2f, #a8e063)'; // Зелений
        case 2: return 'linear-gradient(135deg, #f12711, #f5af19)'; // Помаранчевий
        case 3: return 'linear-gradient(135deg, #8E2DE2, #4A00E0)'; // Фіолетовий
        case 4: return 'linear-gradient(135deg, #FF416C, #FF4B2B)'; // Червоний
        case 5: return 'linear-gradient(135deg, #1CB5E0, #000046)'; // Темно-синій
        case 6: return 'linear-gradient(135deg, #DA4453, #89216B)'; // Малиновий
        case 7: return 'linear-gradient(135deg, #00B4DB, #0083B0)'; // Бірюзовий
        case 8: return 'linear-gradient(135deg, #aa4b6b, #3b8d99)'; // Бронзовий/Мікс
        case 9: return 'linear-gradient(135deg, #41295a, #2F0743)'; // Темно-фіолетовий
        case 10: default: return 'linear-gradient(135deg, #000000, #434343)'; // Чорний
      }
    }

    function endGame() { 
      document.getElementById('game-screen').classList.add('hidden'); 
      document.getElementById('end-screen').classList.remove('hidden'); 
    }
  </script>
</body>
</html>
